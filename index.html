<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>TORUK — The adaptive AI ecosystem</title>
    <meta
      name="description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform — from isolated experiments to secure, production-ready systems."

    <link rel="canonical" href="https://toruk.studio/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toruk.studio/" />
    <meta property="og:title" content="TORUK — The adaptive AI ecosystem" />
    <meta
      property="og:description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform."

    <meta property="og:image" content="https://toruk.studio/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TORUK — The adaptive AI ecosystem" />

      name="twitter:description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform."
    />
    <meta name="twitter:image" content="https://toruk.studio/og-image.png" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030303" />

    <!-- Satoshi (Fontshare) — Light 300 / Regular 400 / Medium 500 per the Figma frame -->
    <link rel="preconnect" href="https://api.fontshare.com" />

    <link
      href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@300,400,500&display=swap"
      rel="stylesheet"
    />

    <!--
      Instrument Sans 400/500 — the splash screen's node cards, per the design
      handoff. TODO: self-host alongside Satoshi before launch.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />
