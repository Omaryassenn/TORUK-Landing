<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>TORUK — The adaptive AI ecosystem</title>
    <meta
      name="description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform — from isolated experiments to secure, production-ready systems."
    />
    <link rel="canonical" href="https://toruk.studio/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://toruk.studio/" />
    <meta property="og:title" content="TORUK — The adaptive AI ecosystem" />
    <meta
      property="og:description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform."
    />
    <meta property="og:image" content="https://toruk.studio/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TORUK — The adaptive AI ecosystem" />
    <meta
      name="twitter:description"
      content="Build, orchestrate, deploy, and govern enterprise AI agents from one platform."
    />
    <meta name="twitter:image" content="https://toruk.studio/og-image.png" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030303" />

    <!--
      Satoshi self-hosted. Preloads start the woff2 fetches in parallel with the
      splash; crossorigin is required even same-origin because fonts always use
      the anonymous CORS mode.
    -->
    <link
      rel="preload"
      href="/fonts/Satoshi-Light.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Satoshi-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Satoshi-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
